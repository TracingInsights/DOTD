name: Update Driver of the Day Data (article fallback)

# NOTE: the scheduled cron has been retired. The official awards pipeline
# (.github/workflows/fetch_official_dotd.yml) is now the source of truth and
# owns the weekly update, so this article scraper must not run on a schedule
# and re-round two-decimal official percentages back to one decimal.
# It remains available as a manual fallback via workflow_dispatch.
on:
  workflow_dispatch:
    # Manual triggering only — see fetch_official_dotd.yml for the cron job

jobs:
  update-dotd-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DOTD data fetcher
        run: |
          python latest_dotd.py

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          echo "changes=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

      - name: Commit and push if there are changes
        if: steps.git-check.outputs.changes > 0
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Update Driver of the Day data [automated]"
          git push
